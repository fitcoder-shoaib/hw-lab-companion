<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HW Lab Theory Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}

/* Layout: a lab bench. Left rail = DIP chips (one per experiment), right = datasheet panel with a green trainer-kit board inside. */
:root{
  --paper:#EDF1EB; --paper-2:#E1E7DF; --surface:#F7F9F5;
  --ink:#16211B; --ink-2:#4B5B51; --rule:#C3CEC5; --grid:rgba(31,94,59,.075);
  --accent:#1F5E3B; --on-accent:#FFFFFF;
  --copper:#9C5A18; --copper-soft:#EBD6BC;
  --board:#1B4A32; --board-2:#163D29; --board-line:#2F6E4E; --board-ink:#D9EADF; --board-dim:#93B8A0; --board-copper:#E6A55E;
  --chip:#1D1F22; --chip-ink:#E8E8E4; --chip-dim:#9A9EA3; --pin:#B7BBC0;
  --led:#FF3B2F; --led-off:#4A2725; --led-ok:#3FD47A;
  --warn:#B3261E;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1510; --paper-2:#132019; --surface:#15241C;
  --ink:#DCE6DF; --ink-2:#95A89B; --rule:#26382D; --grid:rgba(120,200,150,.05);
  --accent:#62C78D; --on-accent:#0C1510;
  --copper:#DE9A55; --copper-soft:#3A2916;
  --board:#11301F; --board-2:#0D2618; --board-line:#245A3D; --board-ink:#D2E5D8; --board-dim:#86A893; --board-copper:#E6A55E;
  --chip:#07080A; --chip-ink:#E6E6E2; --chip-dim:#8D9196; --pin:#878B90;
  --led:#FF4A3D; --led-off:#3A2220; --led-ok:#46DB82; --warn:#FF7A70;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1510; --paper-2:#132019; --surface:#15241C;
  --ink:#DCE6DF; --ink-2:#95A89B; --rule:#26382D; --grid:rgba(120,200,150,.05);
  --accent:#62C78D; --on-accent:#0C1510;
  --copper:#DE9A55; --copper-soft:#3A2916;
  --board:#11301F; --board-2:#0D2618; --board-line:#245A3D; --board-ink:#D2E5D8; --board-dim:#86A893; --board-copper:#E6A55E;
  --chip:#07080A; --chip-ink:#E6E6E2; --chip-dim:#8D9196; --pin:#878B90;
  --led:#FF4A3D; --led-off:#3A2220; --led-ok:#46DB82; --warn:#FF7A70;
  color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px}
.mono{font-family:var(--f-mono)}
.ov{text-decoration:overline;text-decoration-thickness:1.5px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.top h1 span{color:var(--accent)}
.silk{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.top .meta{display:flex;flex-direction:column;gap:2px;text-align:right}
.progress{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.progress .bar{width:140px;height:8px;background:var(--paper-2);border:1px solid var(--rule)}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;margin-top:22px}
/* chip rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 24px);overflow:auto;padding:8px 6px 8px 2px}
.rail-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase;margin:4px 0 -4px}
.chip{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:radial-gradient(circle at 0 50%,var(--paper) 0 7px,transparent 7.5px),var(--chip);color:var(--chip-ink);
  border:none;border-radius:3px;padding:10px 12px 10px 18px;margin:5px 0;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.chip::before,.chip::after{content:"";position:absolute;left:12px;right:12px;height:5px;background:repeating-linear-gradient(90deg,var(--pin) 0 6px,transparent 6px 13px)}
.chip::before{top:-5px}.chip::after{bottom:-5px}
.chip .cid{font-family:var(--f-mono);font-size:11px;color:var(--chip-dim);letter-spacing:.08em}
.chip .cname{grid-column:1;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.1;letter-spacing:.02em;text-transform:uppercase}
.chip .dot{grid-row:1/3;grid-column:2;width:9px;height:9px;border-radius:50%;background:var(--led-off)}
.chip.done .dot{background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.chip[aria-current="true"]{outline:2px solid var(--copper);outline-offset:3px}
.chip[aria-current="true"] .dot{background:var(--led);box-shadow:0 0 8px var(--led)}
.chip.util{background:radial-gradient(circle at 0 50%,var(--paper) 0 7px,transparent 7.5px),var(--accent);color:var(--on-accent)}
.chip.util .cid{color:var(--on-accent);opacity:.75}

/* main panel */
main{min-width:0}
.exp-eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ictag{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 8px;border:1px solid var(--ink);background:var(--surface)}
.exp-title{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1;margin:10px 0 16px;text-transform:uppercase;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:12px;margin-bottom:24px}
.tabs{display:inline-flex;border:2px solid var(--ink);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.tabs button{background:transparent;border:none;padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button .n{font-size:11px;opacity:.6}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.toggles{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tbtn .lamp{width:9px;height:9px;border-radius:50%;background:var(--led-off)}
.tbtn[aria-pressed="true"] .lamp{background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}

/* concept */
.panel{display:flex;flex-direction:column;gap:26px}
.lead-box{border:2px solid var(--ink);background:var(--surface);padding:18px 20px}
.lead-box .silk{display:block;margin-bottom:6px;color:var(--copper);font-weight:600}
.lead-box p{margin:0;font-size:18.5px;line-height:1.55;max-width:68ch}
h3.sec{font-family:var(--f-display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.terms{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);border-top:1px solid var(--rule)}
.terms dt,.terms dd{margin:0;padding:9px 0;border-bottom:1px solid var(--rule)}
.terms dt{font-family:var(--f-mono);font-weight:600;font-size:13.5px;color:var(--copper);padding-right:14px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.note{padding:14px 16px;background:var(--paper-2);border:1px solid var(--rule)}
.note.hook{background:var(--copper-soft);border:1px dashed var(--copper)}
.note .silk{display:block;margin-bottom:4px;font-weight:600}
.note p{margin:0}

/* bench (trainer kit) */
.bench{background:var(--board);color:var(--board-ink);border:1px solid var(--board-line);border-radius:6px;padding:16px;
  background-image:linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.035) 31px 33px,transparent 33px),linear-gradient(transparent 0 31px,rgba(255,255,255,.03) 31px 33px,transparent 33px);background-size:64px 64px}
.bench-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bench-head .silk{color:var(--board-dim)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{background:transparent;border:1px solid var(--board-line);color:var(--board-ink);border-radius:3px;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.modes button[aria-pressed="true"]{background:var(--board-copper);border-color:var(--board-copper);color:#1A1208}
.bench-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.bench-body.single{grid-template-columns:minmax(0,1fr)}
.zone{background:var(--board-2);border:1px solid var(--board-line);border-radius:4px;padding:12px;min-width:0}
.zone+.zone{margin-top:12px}
.zone>.silk{display:block;color:var(--board-dim);font-size:11px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end}
.gap{width:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:none;cursor:pointer;padding:0;color:var(--board-ink)}
.lever{width:24px;height:42px;border-radius:4px;background:#0B1A12;border:1px solid var(--board-line);position:relative}
.lever::after{content:"";position:absolute;left:2px;right:2px;height:18px;bottom:2px;border-radius:3px;background:#C9CDD1;transition:bottom .12s}
.sw[aria-pressed="true"] .lever{background:#3A0F0C}
.sw[aria-pressed="true"] .lever::after{bottom:20px;background:#F1F2F3}
.sw .lab,.out .lab{font-family:var(--f-mono);font-size:12px;font-weight:600}
.sw .val{font-family:var(--f-mono);font-size:11px;color:var(--board-dim)}
.out{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:30px}
.led{width:16px;height:16px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 -2px 3px rgba(0,0,0,.45);transition:background .1s,box-shadow .1s}
.led.on{background:var(--led);box-shadow:0 0 10px var(--led),0 0 2px #fff inset}
.led.hl{outline:2px solid var(--board-copper);outline-offset:2px}
.bus{display:flex;flex-direction:column;gap:5px}
.bus .leds{display:flex;gap:8px;align-items:flex-end}
.bus .leds .out .lab{font-size:10px;color:var(--board-dim);font-weight:500}
.bus .busname{font-family:var(--f-mono);font-size:12px;font-weight:600}
.readout{font-family:var(--f-mono);font-size:14px;background:#08140D;color:#9CF0B8;border:1px solid var(--board-line);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums}
.readout .k{color:var(--board-dim);font-size:11px;display:block}
.msg{font-family:var(--f-mono);font-size:13px;color:var(--board-ink);margin-top:10px;min-height:1.4em}
.msg.bad{color:#FFB3A8}
.bench .tt-wrap{max-height:none}
.bench table.tt{color:var(--board-ink)}
.bench table.tt th{border-color:var(--board-line);color:var(--board-dim)}
.bench table.tt td{border-color:var(--board-line)}
.bench table.tt tbody tr{cursor:pointer}
.bench table.tt tbody tr:hover td{background:rgba(255,255,255,.05)}
.bench table.tt tr.cur td{background:var(--board-copper);color:#1A1208}
.bench table.tt th.o,.bench table.tt td.o{color:inherit}
.btn{background:var(--board-copper);color:#1A1208;border:none;border-radius:3px;padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--board-ink);border:1px solid var(--board-line)}
.btn:disabled{opacity:.5;cursor:default}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hist span{font-family:var(--f-mono);font-size:12px;padding:2px 6px;border:1px solid var(--board-line);border-radius:2px;color:var(--board-dim);font-variant-numeric:tabular-nums}
.hist span:last-child{color:#1A1208;background:var(--board-copper);border-color:var(--board-copper)}
.ramgrid{display:grid;grid-template-columns:auto repeat(3,auto);gap:8px 14px;align-items:center;justify-content:start}
.ramgrid .w{font-family:var(--f-mono);font-size:12px;color:var(--board-dim);padding:2px 6px;border-radius:2px}
.ramgrid .w.sel{background:var(--board-copper);color:#1A1208}

/* tables */
.tt-wrap{overflow-x:auto;max-width:100%}
table.tt{border-collapse:collapse;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
table.tt th,table.tt td{border:1px solid var(--rule);padding:4px 10px;text-align:center}
table.tt th{font-weight:600;color:var(--ink-2);background:transparent}
table.tt th.o,table.tt td.o{color:var(--accent);font-weight:600}
table.tt td.l,table.tt th.l{text-align:left}
.tables{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.tables figure{margin:0}
.tables figcaption{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}

/* exam answer */
.exam{background:var(--surface);border:1px solid var(--rule);padding:clamp(16px,3vw,30px);display:flex;flex-direction:column;gap:22px}
.exam .examhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.exam .examhead b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.ans{position:relative;transition:filter .2s}
.ans h4{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin:0 0 6px;font-weight:600}
.ans p{margin:0 0 10px;max-width:72ch}
.ans p:last-child{margin-bottom:0}
.ans ul{margin:0;padding-left:20px;max-width:72ch}
.ans li{margin-bottom:4px}
.eq{font-family:var(--f-mono);font-size:15px;background:var(--paper-2);border:1px solid var(--rule);padding:10px 14px;margin:8px 0 12px;overflow-x:auto;line-height:1.9;max-width:100%}
.eq b{color:var(--accent);font-weight:600}
body.selftest .exam .ans:not(.shown){filter:blur(6px);cursor:pointer;user-select:none}
body.selftest .exam .ans:not(.shown)::after{content:"tap to reveal";position:absolute;top:0;right:0;font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--paper);padding:2px 6px;filter:none}

/* points */
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.pts li{padding:9px 0 9px 26px;border-bottom:1px solid var(--rule);position:relative;max-width:80ch}
.pts li::before{content:"";position:absolute;left:4px;top:17px;width:10px;height:6px;background:var(--pin);border:1px solid var(--ink-2)}
.abbr{width:100%;border-collapse:collapse}
.abbr td{border-bottom:1px solid var(--rule);padding:8px 10px 8px 0;vertical-align:top}
.abbr td:first-child{font-family:var(--f-mono);font-weight:600;color:var(--copper);white-space:nowrap;width:1%;padding-right:20px}
.search{width:100%;max-width:420px;padding:10px 12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-family:var(--f-mono);font-size:14px;border-radius:3px}

/* viva cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:120px}
.card .q{font-weight:600}
.card .a{color:var(--ink-2);display:none}
.card .tag{font-family:var(--f-mono);font-size:11px;color:var(--copper);letter-spacing:.06em;text-transform:uppercase}
.card .hint{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);margin-top:auto}
.card[aria-expanded="true"]{border-color:var(--accent)}
.card[aria-expanded="true"] .a{display:block;color:var(--ink)}
.card[aria-expanded="true"] .hint{display:none}

@media (max-width:880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:8px 2px 10px;gap:10px}
  .rail-label{display:none}
  .chip{flex:0 0 auto;width:178px}
  .bench-body{grid-template-columns:minmax(0,1fr)}
  .top .meta{text-align:left}
  .progress{justify-content:flex-start}
}
@media (max-width:520px){
  .terms{grid-template-columns:minmax(0,1fr)}
  .terms dt{border-bottom:none;padding-bottom:0}
  .tabs button{padding:8px 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="silk">Digital Lab · Exam Revision · 11 Experiments</div>
      <h1>HW Lab <span>Theory Bench</span></h1>
    </div>
    <div class="meta">
      <div class="silk">Pick a chip → Concept → Exam answer → Points</div>
      <div class="progress"><span class="silk" id="progTxt">0 / 12 revised</span><span class="bar"><i id="progBar"></i></span></div>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Experiments"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const ov = s => '<span class="ov">'+s+'</span>';
const A=ov('A'), B=ov('B'), C=ov('C'), Q=ov('Q');
const CI=ov('C<sub>in</sub>'), BI=ov('B<sub>in</sub>'), QN=ov('Q<sub>n</sub>');
const LBL={Ci:'C<sub>in</sub>',Co:'C<sub>out</sub>',Bi:'B<sub>in</sub>',Bo:'B<sub>out</sub>',RW:'R/'+ov('W'),EN:'EN',Din:'D<sub>in</sub>'};
const lab = k => LBL[k] || k.replace(/^([A-Z]+)(\d)$/,'$1<sub>$2</sub>');
const x = (a,b) => a^b;
const n = a => 1-a;
const store = {
  get(k,d){try{const v=localStorage.getItem('hwbench:'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('hwbench:'+k,JSON.stringify(v));}catch(e){}}
};
function tt(ins, outs, caption){
  const N=ins.length;
  let h='<figure>'+(caption?'<figcaption>'+caption+'</figcaption>':'')+'<div class="tt-wrap"><table class="tt"><thead><tr>'+ins.map(k=>'<th>'+lab(k)+'</th>').join('')+outs.map(o=>'<th class="o">'+o[0]+'</th>').join('')+'</tr></thead><tbody>';
  for(let r=0;r<(1<<N);r++){const v={};ins.forEach((k,i)=>v[k]=(r>>(N-1-i))&1);h+='<tr>'+ins.map(k=>'<td>'+v[k]+'</td>').join('')+outs.map(o=>'<td class="o">'+o[1](v)+'</td>').join('')+'</tr>';}
  return h+'</tbody></table></div></figure>';
}
function table(head, rows, caption, outFrom){
  outFrom = outFrom==null ? head.length : outFrom;
  return '<figure>'+(caption?'<figcaption>'+caption+'</figcaption>':'')+'<div class="tt-wrap"><table class="tt"><thead><tr>'+head.map((h,i)=>'<th'+(i>=outFrom?' class="o"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i>=outFrom?' class="o"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></figure>';
}
const num = (v,p,N) => {let s=0;for(let i=N-1;i>=0;i--)s=s*2+v[p+i];return s;};
const toBits = (val,N) => {const b=[];for(let i=N-1;i>=0;i--)b.push((val>>i)&1);return b;};
const bstr = (val,N) => toBits(val,N).join('');
const sec = (title, body) => '<div class="ans"><h4>'+title+'</h4>'+body+'</div>';

{ id:'exp01', no:'01', short:'Basic & Universal Gates', title:'Realization of Functions using Basic & Universal Gates', ics:['7408','7432','7404','7400','7402'],
  lead:'Any Boolean expression can be built by wiring gates together. SOP form uses AND gates first and one OR gate at the output. POS form uses OR gates first and one AND gate at the output. NAND and NOR are "universal gates" because every other gate, and so any expression, can be built using only NANDs or only NORs.',
  terms:[
    ['Boolean expression','An equation with 0/1 variables and AND, OR, NOT operations, e.g. Y = AB + '+A+B+'.'],
    ['SOP','Sum of Products: products (AND terms) added together (OR). Built with AND gates → one OR gate.'],
    ['POS','Product of Sums: sums (OR terms) multiplied together (AND). Built with OR gates → one AND gate.'],
    ['Universal gate','A gate that can build every other gate alone. NAND and NOR.'],
    ["De Morgan's theorem",ov('A·B')+' = '+A+' + '+B+' and '+ov('A + B')+' = '+A+'·'+B+'. Used to convert into NAND/NOR form.'],
    ['Double complement','Inverting twice gives back the same thing: '+ov(ov('X'))+' = X.'],
    ['XNOR','Output is 1 when the inputs are EQUAL. AB + '+A+B+' is XNOR.'],
    ['XOR','Output is 1 when the inputs are DIFFERENT. (A + B)('+A+' + '+B+') is XOR.']
  ],
  picture:'A universal gate is like one Lego brick shape you can build every model from. Tie both inputs of a NAND together and you get a NOT. NAND followed by that NOT gives AND. Invert both inputs and then NAND them, and you get OR.',
  hook:'To go NAND-only: put two bars over the SOP expression, break the lower bar with De Morgan, and you get a NAND of NANDs. For NOR-only do the same with POS form. Y₁ = AB + '+A+B+' = XNOR (1 when equal). Y₂ = (A+B)('+A+'+'+B+') = XOR (1 when different).',
  sim:{type:'comb',modes:[
    {label:'Y₁ = AB + A′B′',inputs:['A','B'],outs:[['AB',v=>v.A&v.B],[A+B,v=>n(v.A)&n(v.B)],['Y₁',v=>(v.A&v.B)|(n(v.A)&n(v.B))]],note:'SOP: two AND gates feed one OR gate. Y₁ is 1 when A and B are equal (XNOR).'},
    {label:'Y₂ = (A+B)(A′+B′)',inputs:['A','B'],outs:[['A+B',v=>v.A|v.B],[A+'+'+B,v=>n(v.A)|n(v.B)],['Y₂',v=>(v.A|v.B)&(n(v.A)|n(v.B))]],note:'POS: two OR gates feed one AND gate. Y₂ is 1 when A and B differ (XOR).'},
    {label:'NAND → NOT/AND/OR',inputs:['A','B'],outs:[['NOT A',v=>n(v.A&v.A)],['AND',v=>n(n(v.A&v.B))],['OR',v=>n(n(v.A)&n(v.B))]],note:'NOT = NAND with inputs tied. AND = NAND + NOT. OR = NAND of inverted inputs.'},
    {label:'NOR → NOT/OR/AND',inputs:['A','B'],outs:[['NOT A',v=>n(v.A|v.A)],['OR',v=>n(n(v.A|v.B))],['AND',v=>n(n(v.A)|n(v.B))]],note:'NOT = NOR with inputs tied. OR = NOR + NOT. AND = NOR of inverted inputs.'}
  ]},
  exam: ()=>
    sec('1. Aim','<p>To realise the following Boolean expressions using basic gates and universal gates:</p><div class="eq">Y₁ = AB + '+A+B+'<br>Y₂ = (A + B)('+A+' + '+B+')</div>')+
    sec('2. Theory','<p>Logic gates are the basic building blocks of digital electronic circuits. Any Boolean function can be represented by interconnecting several logic gates, that is, by connecting one gate\'s output to another gate\'s input, using AND, OR and NOT gates.</p><p><b>SOP (Sum of Products)</b> form is implemented with AND gates at the input side and, since the output is the sum of all product terms, an OR gate at the output side.</p><p><b>POS (Product of Sums)</b> form is implemented with OR gates at the input side and, since the output is the product of all sum terms, an AND gate at the output side.</p><p><b>NAND and NOR gates are known as universal gates</b> because any basic logic gate or Boolean expression can be realised using NAND gates alone or NOR gates alone.</p>')+
    sec("3. De Morgan's theorems",'<div class="eq">'+ov('A·B')+' = '+A+' + '+B+'<br>'+ov('A + B')+' = '+A+' · '+B+'</div>')+
    sec('4. Realization of Y₁ = AB + '+A+B,
      '<p><b>Basic gates:</b> 2 NOT, 2 AND and 1 OR gate.</p>'+
      '<p><b>NAND only:</b> take double complement and apply De Morgan.</p><div class="eq">Y₁ = '+ov(ov('AB + '+A+B))+' = '+ov(ov('AB')+' · '+ov(A+B))+'</div><p>A′ and B′ are made with NAND inverters, then two NANDs and one output NAND (5 NAND gates).</p>'+
      '<p><b>NOR only:</b> since AB = '+ov(A+' + '+B)+' and '+A+B+' = '+ov('A + B')+',</p><div class="eq">Y₁ = '+ov(A+' + '+B)+' + '+ov('A + B')+'</div><p>A′ and B′ from NOR inverters, two NORs, one NOR and a final NOR inverter (6 NOR gates).</p>')+
    sec('5. Realization of Y₂ = (A + B)('+A+' + '+B+')',
      '<p><b>Basic gates:</b> 2 NOT, 2 OR and 1 AND gate.</p>'+
      '<p><b>NAND only:</b></p><div class="eq">Y₂ = '+ov(ov('(A + B)('+A+' + '+B+')'))+' = '+ov(A+B+' + AB')+' = '+ov(A+B)+' · '+ov('AB')+'</div><p>Two NANDs, then a NAND and a NAND inverter (with input inverters: 6 NAND gates).</p>'+
      '<p><b>NOR only:</b></p><div class="eq">Y₂ = '+ov(ov('A + B')+' + '+ov(A+' + '+B))+'</div><p>A NOR of two NORs (with input inverters: 5 NOR gates).</p>')+
    sec('6. Truth tables','<div class="tables">'+tt(['A','B'],[['Y₁',v=>(v.A&v.B)|(n(v.A)&n(v.B))]],'Y₁ = AB + A′B′')+tt(['A','B'],[['Y₂',v=>(v.A|v.B)&(n(v.A)|n(v.B))]],'Y₂ = (A+B)(A′+B′)')+'</div>')+
    sec('7. Result','<p>Realised the given Boolean expressions using basic gates and universal gates (NAND only and NOR only) and verified their truth tables.</p>'),
  points:[
    'SOP → AND gates first, OR gate at output. POS → OR gates first, AND gate at output.',
    'NAND and NOR are universal gates.',
    'NOT from NAND: tie both inputs together. Same for NOR.',
    'SOP converts naturally to NAND-NAND. POS converts naturally to NOR-NOR.',
    'AB + A′B′ is the XNOR function (equivalence). (A+B)(A′+B′) is the XOR function.',
    "De Morgan: break the bar, change the sign (· ↔ +).",
    'ICs used: 7408, 7432, 7404, 7400, 7402. Pin 14 = +5 V, pin 7 = GND.'
  ],
  abbr:[['SOP','Sum of Products'],['POS','Product of Sums'],['NAND','NOT-AND'],['NOR','NOT-OR'],['XNOR','Exclusive NOR (equivalence gate)']]
},

{ id:'exp02', no:'02', short:'Adders & Subtractors', title:'Half Adder, Full Adder, Half Subtractor & Full Subtractor', ics:['7486','7400','7408','7432','7404'],
  lead:'These circuits do binary arithmetic one column at a time. A half adder adds 2 bits and gives Sum and Carry. A full adder adds 3 bits (A, B and the carry coming in from the previous column). A half subtractor subtracts one bit from another and gives Difference and Borrow. A full subtractor also takes the borrow from the previous column.',
  terms:[
    ['Half adder','Adds two 1-bit numbers. 2 inputs (A, B), 2 outputs (Sum, Carry).'],
    ['Full adder','Adds three bits: A, B and carry-in. 2 outputs (Sum, Carry-out).'],
    ['Half subtractor','Subtracts B from A. 2 inputs, 2 outputs (Difference, Borrow).'],
    ['Full subtractor','Subtracts B and the previous borrow from A. 3 inputs, 2 outputs (Difference, Borrow-out).'],
    ['Minuend','The number you subtract FROM (A).'],
    ['Subtrahend','The number being subtracted (B).'],
    ['Carry','The extra 1 sent to the next column when the sum is 2 or more.'],
    ['Borrow','The 1 taken from the next column when you do 0 − 1.']
  ],
  picture:'Think of adding by hand: 0+0 = 0, 0+1 = 1, 1+1 = 10 (write 0, carry 1). The rightmost column has no carry coming in, so a half adder is enough. Every other column must also add the carry from its right, so it needs a full adder. Subtraction is the same, with borrow instead of carry: 0 − 1 = 1, borrow 1.',
  hook:'Sum and Difference are BOTH XOR. Only the second output changes: Carry = AB, Borrow = '+A+'B (note the bar on A). Full adder = 2 half adders + 1 OR gate. Full subtractor = 2 half subtractors + 1 OR gate.',
  sim:{type:'comb',modes:[
    {label:'Half adder',inputs:['A','B'],outs:[['S',v=>x(v.A,v.B)],['C',v=>v.A&v.B]],note:'S = A ⊕ B · C = AB'},
    {label:'Full adder',inputs:['A','B','Ci'],outs:[['S',v=>v.A^v.B^v.Ci],['C<sub>out</sub>',v=>((v.A^v.B)&v.Ci)|(v.A&v.B)]],note:'S = A ⊕ B ⊕ C<sub>in</sub> · C<sub>out</sub> = (A ⊕ B)C<sub>in</sub> + AB'},
    {label:'Half subtractor',inputs:['A','B'],outs:[['D',v=>x(v.A,v.B)],['B<sub>out</sub>',v=>n(v.A)&v.B]],note:'D = A ⊕ B · B<sub>out</sub> = '+A+'B'},
    {label:'Full subtractor',inputs:['A','B','Bi'],outs:[['D',v=>v.A^v.B^v.Bi],['B<sub>out</sub>',v=>(n(v.A^v.B)&v.Bi)|(n(v.A)&v.B)]],note:'D = A ⊕ B ⊕ B<sub>in</sub> · B<sub>out</sub> = '+ov('A ⊕ B')+'B<sub>in</sub> + '+A+'B'}
  ]},
  exam: ()=>
    sec('1. Aim','<p>To realise half adder, full adder, half subtractor and full subtractor (i) using EX-OR and NAND gates and (ii) using NAND gates alone.</p>')+
    sec('2. Half adder','<p>A half adder adds two bits. It has two inputs, A and B (two 1-bit numbers), and two outputs: Sum (S) and Carry (C).</p><div class="eq">S = '+A+'B + A'+B+' = <b>A ⊕ B</b><br>C = <b>AB</b></div>'+'<div class="tables">'+tt(['A','B'],[['S',v=>x(v.A,v.B)],['C',v=>v.A&v.B]])+'</div>')+
    sec('3. Full adder','<p>A full adder is used when more than 2 bits are to be added. Addition starts at the least significant bit, where a half adder is enough. Higher bits must also add the carry from the previous bit, so a full adder with 3 inputs (A, B, C<sub>in</sub>) and 2 outputs (Sum and Carry) is used.</p><div class="eq">S = '+A+B+'C<sub>in</sub> + '+A+'B'+CI+' + A'+B+CI+' + ABC<sub>in</sub> = <b>A ⊕ B ⊕ C<sub>in</sub></b><br>C<sub>out</sub> = '+A+'BC<sub>in</sub> + A'+B+'C<sub>in</sub> + AB'+CI+' + ABC<sub>in</sub> = <b>(A ⊕ B)C<sub>in</sub> + AB</b></div><div class="tables">'+tt(['A','B','Ci'],[['S',v=>v.A^v.B^v.Ci],['C<sub>out</sub>',v=>((v.A^v.B)&v.Ci)|(v.A&v.B)]])+'</div>')+
    sec('4. Half subtractor','<p>A half subtractor subtracts one bit from another. It has two inputs: A (minuend) and B (subtrahend), and two outputs: Difference (D) and Borrow (B<sub>out</sub>).</p><div class="eq">D = '+A+'B + A'+B+' = <b>A ⊕ B</b><br>B<sub>out</sub> = <b>'+A+'B</b></div><div class="tables">'+tt(['A','B'],[['D',v=>x(v.A,v.B)],['B<sub>out</sub>',v=>n(v.A)&v.B]])+'</div>')+
    sec('5. Full subtractor','<p>A full subtractor has 3 inputs: minuend (A), subtrahend (B) and previous borrow (B<sub>in</sub>), and 2 outputs: Difference and Borrow.</p><div class="eq">D = '+A+B+'B<sub>in</sub> + '+A+'B'+BI+' + A'+B+BI+' + ABB<sub>in</sub> = <b>A ⊕ B ⊕ B<sub>in</sub></b><br>B<sub>out</sub> = '+A+B+'B<sub>in</sub> + '+A+'B'+BI+' + '+A+'BB<sub>in</sub> + ABB<sub>in</sub> = <b>'+ov('A ⊕ B')+'B<sub>in</sub> + '+A+'B</b></div><div class="tables">'+tt(['A','B','Bi'],[['D',v=>v.A^v.B^v.Bi],['B<sub>out</sub>',v=>(n(v.A^v.B)&v.Bi)|(n(v.A)&v.B)]])+'</div>')+
    sec('6. Realization','<ul><li><b>Using XOR & NAND:</b> XOR gates (7486) give S / D. NAND gates (7400) give carry / borrow (AB = NAND followed by NAND inverter).</li><li><b>Using NAND only:</b> half adder needs 5 NAND gates (4 for XOR, 1 for carry). Full adder needs 9 NAND gates.</li><li>A full adder can be built from 2 half adders and an OR gate. A full subtractor from 2 half subtractors and an OR gate.</li></ul>')+
    sec('7. Result','<p>Realised half adder, full adder, half subtractor and full subtractor using basic gates and universal gates, and verified their truth tables.</p>'),
  points:[
    'Half adder: S = A ⊕ B, C = AB.',
    'Full adder: S = A ⊕ B ⊕ C<sub>in</sub>, C<sub>out</sub> = (A ⊕ B)C<sub>in</sub> + AB (also = AB + BC<sub>in</sub> + AC<sub>in</sub>).',
    'Half subtractor: D = A ⊕ B, B<sub>out</sub> = '+A+'B.',
    'Full subtractor: D = A ⊕ B ⊕ B<sub>in</sub>, B<sub>out</sub> = '+ov('A ⊕ B')+'B<sub>in</sub> + '+A+'B.',
    'Why "half" adder: it cannot accept a carry from a previous stage.',
    'Full adder = 2 half adders + 1 OR gate.',
    'NAND-only half adder = 5 gates. NAND-only full adder = 9 gates.',
    'Pin 14 = +5 V, pin 7 = GND on all these ICs.'
  ],
  abbr:[['HA','Half Adder'],['FA','Full Adder'],['HS','Half Subtractor'],['FS','Full Subtractor'],['S','Sum'],['C / C<sub>out</sub>','Carry / Carry out'],['C<sub>in</sub>','Carry in (from previous stage)'],['D','Difference'],['B<sub>out</sub>','Borrow out'],['B<sub>in</sub>','Borrow in'],['LSB','Least Significant Bit'],['MSB','Most Significant Bit']]
},
